const chRow=(s,c)=>`<div class="ch"><span class="gl" style="color:${c.s==1?"var(--ok)":c.s==-1?"var(--no)":"var(--mu)"}">${c.s==1?"✓":c.s==-1?"✗":"○"}</span><span class="t">${esc(c.t)}</span><button class="st ok ${c.s==1?"on":""}" data-a="set" data-s="${s.id}" data-c="${c.id}" data-v="1" aria-label="${t("done")}">✓</button><button class="st no ${c.s==-1?"on":""}" data-a="set" data-s="${s.id}" data-c="${c.id}" data-v="-1" aria-label="${t("ns")}">✗</button><button class="st" data-a="cmenu" data-s="${s.id}" data-c="${c.id}" aria-label="menu">⋯</button></div>`;

function home(){const o=tot(),td=doneOn(ds(new Date())),g=S.goal,h=new Date().getHours(),nx=ups().slice(0,3);
return`<h1 style="font-size:28px">${t(h<12?"gm":h<17?"ga":"ge")}${S.name?", "+esc(S.name):""}</h1><p class="mu" style="margin:2px 0 18px">${new Date().toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"})}</p>
<div class="hero"><div class="row w" style="gap:20px"><div class="rgw">${rng(o.p,124,11)}<b class="num">${N(o.p)}%</b></div><div class="four" style="flex:1;min-width:150px">${[["subjects",S.subjects.length],["chapters",o.n],["done",o.d],["rem",o.r]].map(([k,v])=>`<div><b class="num">${N(v)}</b><span class="mu">${t(k)}</span></div>`).join("")}</div></div><div class="mu" style="margin-top:14px">${t("overall")}</div></div>
<div class="sec"><div class="row sp"><h3>${t("target")}</h3><span class="mu">${N(Math.min(td,g))}/${N(g)} ${t("chapters")}</span></div><div class="bar0"><i style="width:${Math.min(100,td/g*100)}%"></i></div></div>
<div class="grid"><button class="pill" data-a="tab" data-v="subj">${I(ICO.book)}${t("tracker")}</button><button class="pill" data-a="tab" data-v="al">${I(ICO.bell)}${t("alarms")}</button></div>
<div class="sec"><h3>${t("next")}</h3>${nx.length?nx.map(x=>`<div class="li row sp"><div><b class="num" style="font-size:22px">${N(x.a.time)}</b><div class="mu">${esc(x.a.label||t("alarm"))}</div></div><span class="mu">${inx(x.d)}</span></div>`).join(""):`<p class="mu">${t("emptyA")}</p>`}</div>`}

function subj(){return`<div class="row sp"><h2>${t("subjects")}</h2><button class="b" data-a="addS">${t("addS")}</button></div>`+(S.subjects.length?S.subjects.map(s=>{const p=sp(s);return`<div class="sec"><div class="row sp" data-a="tog" data-id="${s.id}"><div style="min-width:0"><b style="font-size:17px">${esc(s.name)}</b><div class="mu">${N(s.ch.filter(c=>c.s==1).length)}/${N(s.ch.length)} ${t("chapters")}</div></div><div class="row"><b class="num" style="font-size:20px">${N(p)}%</b><button class="ic sm" data-a="smenu" data-id="${s.id}" aria-label="menu">⋯</button></div></div>${strip(s)}${opn[s.id]?`<div style="margin-top:12px">${s.ch.length?s.ch.map(c=>chRow(s,c)).join(""):`<p class="mu">${t("emptyC")}</p>`}</div><button class="b g" style="margin-top:12px" data-a="addC" data-id="${s.id}">${t("addC")}</button>`:""}</div>`}).join(""):`<div class="empty">${t("emptyS")}</div>`)}

function al(){const D=DAYS(),L=[...S.alarms].sort((a,b)=>a.time<b.time?-1:1);return`<div class="row sp"><h2>${t("alarms")}</h2><button class="b" data-a="aed" data-id="">${t("addA")}</button></div><div style="margin-top:14px">`+(L.length?L.map(a=>`<div class="li row sp"><div data-a="aed" data-id="${a.id}" style="flex:1"><b class="num big" style="${a.on?"":"color:var(--mu)"}">${N(a.time)}</b><div>${esc(a.label||t("alarm"))}</div><div class="mu">${a.days.length?a.days.map(i=>D[i]).join(" "):t("once")}</div></div><button class="sw ${a.on?"on":""}" data-a="atg" data-id="${a.id}" aria-label="${t("alarm")}"></button></div>`).join(""):`<div class="empty">${t("emptyA")}</div>`)+`</div>`}

function sl(){const D=DAYS(),E=[...S.sleep].sort((a,b)=>a.date<b.date?1:-1),d7=lastDays(7),av=n=>{const a=lastDays(n).map(slp).filter(x=>x);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0},H=S.sleep.filter(e=>okW(e)===true).length,M=S.sleep.filter(e=>okW(e)===false).length,p=S.pending;
return`<h2 style="margin-bottom:14px">${t("sleep")}</h2><div class="hero">${p?`<p style="margin:0 0 12px">${t("since").replace("{x}",N(p.bed))}</p><div class="row"><button class="b" style="flex:1" data-a="wNow">${t("woke")}</button><button class="b g" data-a="cP">${t("cancel")}</button></div>`:`<button class="b" style="width:100%" data-a="sNow">${t("goSleep")}</button>`}<p class="mu" style="margin:12px 0 0">${t("hint")}</p></div>
<div class="sec four"><div><b class="num">${av(7)?hrs(av(7)):"–"}</b><span class="mu">${t("avg7")}</span></div><div><b class="num">${av(30)?hrs(av(30)):"–"}</b><span class="mu">${t("avg30")}</span></div><div><b class="num" style="color:var(--ok)">${N(H)}</b><span class="mu">${t("hit")}</span></div><div><b class="num" style="color:var(--no)">${N(M)}</b><span class="mu">${t("miss")}</span></div></div>
<div class="sec" style="margin-top:0">${bars(d7.map(d=>+(slp(d)/60).toFixed(1)),d7.map(d=>D[d.getDay()]),9,N)}</div>
<div class="row sp"><h3>${t("sleep")}</h3><button class="b g" data-a="sed" data-id="">${t("addR")}</button></div>`+(E.length?E.slice(0,30).map(e=>{const o=okW(e);return`<div class="li row sp" data-a="sed" data-id="${e.id}"><div><b>${fd(e.date)}</b><div class="mu">${N(e.bed)} – ${N(e.wake)}</div></div><div style="text-align:right"><b class="num">${hrs(dur(e))}</b>${o===null?"":`<div style="font-size:12px;color:var(--${o?"ok":"no"})">${o?"✓ "+t("hit"):"✗ "+t("miss")}</div>`}</div></div>`}).join(""):`<div class="empty">${t("emptyZ")}</div>`)}

function stt(){const o=tot(),D=DAYS(),d7=lastDays(7),d14=lastDays(14),wk=d7.reduce((a,d)=>a+doneOn(ds(d)),0),td=doneOn(ds(new Date())),g=S.goal,w=g*7,s30=lastDays(30).filter(d=>doneOn(ds(d))).length;
return`<h2 style="margin-bottom:14px">${t("stats")}</h2><div class="hero four"><div><b class="num">${N(o.d)}</b><span class="mu">${t("done")}</span></div><div><b class="num">${N(o.r)}</b><span class="mu">${t("rem")}</span></div></div>
<div class="sec"><h3>${t("subjP")}</h3>${S.subjects.length?S.subjects.map(s=>`<div class="li"><div class="row sp"><span>${esc(s.name)}</span><b>${N(sp(s))}%</b></div>${strip(s)}</div>`).join(""):`<p class="mu">${t("emptyS")}</p>`}</div>
<div class="sec"><h3>${t("act")}</h3>${bars(d7.map(d=>doneOn(ds(d))),d7.map(d=>D[d.getDay()]),g,N)}</div>
<div class="sec four"><div><b class="num">${N(streak())}</b><span class="mu">${t("streak")}</span></div><div><b class="num">${N(s30)}</b><span class="mu">${t("days30")}</span></div></div>
<div class="sec"><h3>${t("goals")}</h3><div class="row sp mu" style="margin-top:10px"><span>${t("daily")}</span><span>${N(Math.min(td,g))}/${N(g)}</span></div><div class="bar0"><i style="width:${Math.min(100,td/g*100)}%"></i></div><div class="row sp mu" style="margin-top:16px"><span>${t("weekly")}</span><span>${N(Math.min(wk,w))}/${N(w)}</span></div><div class="bar0"><i style="width:${Math.min(100,wk/w*100)}%"></i></div></div>
<div class="sec"><h3>${t("trend")}</h3>${bars(d14.map(d=>+(slp(d)/60).toFixed(1)),d14.map(d=>N(d.getDate())),9,N)}</div>`}

function cfg(){return`<h2>${t("settings")}</h2>
<div class="sec"><h3>${t("lang")}</h3><div class="row" style="margin-top:12px"><button class="b ${S.lang=="en"?"":"g"}" data-a="lg" data-v="en">English 🇬🇧</button><button class="b ${S.lang=="bn"?"":"g"}" data-a="lg" data-v="bn">বাংলা 🇧🇩</button></div></div>
<div class="sec"><h3>${t("you")}</h3><input data-f="name" value="${esc(S.name)}" maxlength="30"></div>
<div class="sec"><h3>${t("accent")}</h3><div class="row" style="margin-top:12px">${["#9a8cff","#4cc9ff","#6ef0b0"].map(c=>`<button class="dot ${S.accent==c?"on":""}" style="background:${c}" data-a="ac" data-v="${c}" aria-label="${c}"></button>`).join("")}</div></div>
<div class="sec row sp"><h3>${t("daily")}</h3><div class="row"><button class="ic sm" data-a="gl" data-v="-1">−</button><b class="num" style="min-width:28px;text-align:center">${N(S.goal)}</b><button class="ic sm" data-a="gl" data-v="1">+</button></div></div>
<div class="sec"><div class="row sp"><h3>${t("notif")}</h3><button class="sw ${S.notif?"on":""}" data-a="nt" aria-label="${t("notif")}"></button></div><div class="row sp" style="margin-top:16px"><h3>${t("snoozeMin")}</h3><div class="row">${[5,10,15].map(m=>`<button class="chip ${S.snooze==m?"on":""}" data-a="sz" data-v="${m}">${N(m)}${t("m")}</button>`).join("")}</div></div></div>
<div class="sec"><div class="row"><button class="b" data-a="bk">${t("backup")}</button><button class="b g" data-a="rs">${t("restore")}</button></div><textarea id="bk" rows="3" placeholder="${esc(t("bkHint"))}"></textarea><input type="file" accept=".json,application/json"></div>
<div class="sec"><button class="b d" data-a="rz">${t("reset")}</button><p class="mu" style="margin-top:22px"><b>STUcation</b></p></div>`}

const NL={home:"home",subj:"subjects",al:"alarms",sl:"sleep",st:"stats"};
function render(){const V={home,subj,al,sl,st:stt,set:cfg}[tab];$("#app").innerHTML=`<div class="top">${word()}<button class="ic" data-a="tab" data-v="set" aria-label="${t("settings")}">${I(ICO.set)}</button></div>${V()}<nav><div>${[["home","home"],["subj","book"],["al","bell"],["sl","moon"],["st","chart"]].map(([k,i])=>`<button class="${tab==k?"on":""}" data-a="tab" data-v="${k}">${I(ICO[i])}<span>${t(NL[k])}</span></button>`).join("")}</div></nav>`}

const modal=h=>{$("#m").innerHTML=`<div class="ov" data-a="x"><div class="sheet">${h}</div></div>`},shut=()=>{$("#m").innerHTML="";okCb=null};
const ask=(title,val,cb)=>{modal(`<h3>${title}</h3><input id="mi" value="${esc(val)}" maxlength="60"><div class="row"><button class="b g" data-a="x">${t("cancel")}</button><button class="b" style="flex:1" data-a="ok">${t("save")}</button></div>`);okCb=()=>{const v=$("#mi").value.trim();if(v){shut();cb(v)}};setTimeout(()=>{const i=$("#mi");i&&i.focus()},60)};
const sure=(cb,msg,lbl)=>{modal(`<p style="margin:0 0 16px">${msg||t("sure")}</p><div class="row"><button class="b g" data-a="x">${t("cancel")}</button><button class="b d" style="flex:1" data-a="ok">${lbl||t("del")}</button></div>`);okCb=()=>{shut();cb()}};
const menu=it=>modal(`<div class="mn">${it.map(([l,a,at])=>`<button class="b g" data-a="${a}" ${at}>${l}</button>`).join("")}</div>`);
const sub=id=>S.subjects.find(s=>s.id==id),chp=(s,c)=>s.ch.find(x=>x.id==c);
const accent=()=>document.documentElement.style.setProperty("--ac",S.accent);
const toast=m=>{const e=$("#toast");e.textContent=m;e.className="show";clearTimeout(tt);tt=setTimeout(()=>e.className="",2600)};
const beep=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.2)}catch(e){}};
function stopRing(){clearInterval(ringT);$("#ring").className=""}
function ring(l){ringL=l;clearInterval(ringT);$("#ring").innerHTML=`<div class="rb">${mark(64)}<b class="num" style="font-size:60px;margin-top:20px">${N(hm(new Date()))}</b><h2>${esc(l)}</h2><div class="row" style="margin-top:28px;width:100%"><button class="b g" style="flex:1" data-a="sn">${t("snooze")} ${N(S.snooze)}${t("m")}</button><button class="b" style="flex:1" data-a="dis">${t("dismiss")}</button></div></div>`;$("#ring").className="on";const f=()=>{beep();navigator.vibrate&&navigator.vibrate(300)};f();ringT=setInterval(f,1000);try{if(S.notif&&Notification.permission=="granted"){const R=navigator.serviceWorker&&navigator.serviceWorker.ready;R?R.then(r=>r.showNotification("STUcation",{body:l,vibrate:[300,100,300]})):new Notification("STUcation",{body:l})}}catch(e){}}

const A={
x:()=>shut(),ok:()=>okCb&&okCb(),
tab:d=>{tab=d.v;render();scrollTo(0,0)},tog:d=>{opn[d.id]=!opn[d.id];render()},
addS:()=>ask(t("addS"),"",v=>{const s={id:uid(),name:v,ch:[]};S.subjects.push(s);opn[s.id]=1;sv()}),
smenu:d=>menu([[t("ren"),"rS",`data-id="${d.id}"`],[t("del"),"dS",`data-id="${d.id}"`]]),
rS:d=>{const s=sub(d.id);ask(t("ren"),s.name,v=>{s.name=v;sv()})},
dS:d=>sure(()=>{S.subjects=S.subjects.filter(s=>s.id!=d.id);sv()}),
addC:d=>ask(t("addC"),"",v=>{sub(d.id).ch.push({id:uid(),t:v,s:0});opn[d.id]=1;sv()}),
set:d=>{const c=chp(sub(d.s),d.c),v=+d.v;if(c.s==v){c.s=0;delete c.d}else{c.s=v;if(v==1)c.d=ds(new Date());else delete c.d}sv()},
cmenu:d=>{const a=`data-s="${d.s}" data-c="${d.c}"`;menu([[t("ren"),"rC",a],[t("up"),"mv",a+' data-v="-1"'],[t("dn"),"mv",a+' data-v="1"'],[t("del"),"dC",a]])},
rC:d=>{const c=chp(sub(d.s),d.c);ask(t("ren"),c.t,v=>{c.t=v;sv()})},
mv:d=>{const s=sub(d.s),i=s.ch.findIndex(c=>c.id==d.c),j=i+ +d.v;if(j>=0&&j<s.ch.length)[s.ch[i],s.ch[j]]=[s.ch[j],s.ch[i]];shut();sv()},
dC:d=>sure(()=>{const s=sub(d.s);s.ch=s.ch.filter(c=>c.id!=d.c);sv()}),
aed:d=>{const a=S.alarms.find(x=>x.id==d.id)||{id:uid(),time:"07:00",label:"",days:[],on:true,nw:1};EA=a;modal(`<h3>${t("alarm")}</h3><input id="at" type="time" value="${a.time}"><input id="al" placeholder="${esc(t("label"))}" value="${esc(a.label)}" maxlength="40"><p class="mu" style="margin:6px 0 0">${t("repeat")}</p><div class="chips">${DAYS().map((x,i)=>`<button class="chip ${a.days.includes(i)?"on":""}" data-a="chip">${x}</button>`).join("")}</div><div class="row">${a.nw?"":`<button class="b d" data-a="adel">${t("del")}</button>`}<button class="b" style="flex:1" data-a="asave">${t("save")}</button></div>`)},
chip:(d,el)=>el.classList.toggle("on"),
asave:()=>{const a=EA;a.time=$("#at").value||"07:00";a.label=$("#al").value.trim();a.days=[...$("#m").querySelectorAll(".chip")].map((c,i)=>c.classList.contains("on")?i:-1).filter(i=>i>=0);delete a.nw;if(!S.alarms.includes(a))S.alarms.push(a);shut();sv()},
adel:()=>{S.alarms=S.alarms.filter(x=>x!=EA);shut();sv()},
atg:d=>{const a=S.alarms.find(x=>x.id==d.id);a.on=!a.on;sv()},
sNow:()=>{const x=ups()[0];S.pending={bed:hm(new Date()),target:x?x.a.time:""};sv()},
cP:()=>{S.pending=null;sv()},
wNow:()=>{const p=S.pending,n=new Date();S.sleep.push({id:uid(),date:ds(n),bed:p.bed,wake:hm(n),target:p.target});S.pending=null;sv()},
sed:d=>{const e=S.sleep.find(x=>x.id==d.id)||{id:uid(),date:ds(new Date()),bed:"23:00",wake:"07:00",target:"",nw:1};EA=e;modal(`<h3>${t("sleep")}</h3><p class="mu" style="margin:8px 0 0">${t("date")}</p><input id="sd" type="date" value="${e.date}"><div class="grid"><div><p class="mu" style="margin:0">${t("bed")}</p><input id="sb" type="time" value="${e.bed}"></div><div><p class="mu" style="margin:0">${t("wake")}</p><input id="sw" type="time" value="${e.wake}"></div></div><p class="mu" style="margin:0">${t("tgt")}</p><input id="sg" type="time" value="${e.target||""}"><div class="row">${e.nw?"":`<button class="b d" data-a="sdel">${t("del")}</button>`}<button class="b" style="flex:1" data-a="ssave">${t("save")}</button></div>`)},
ssave:()=>{const e=EA,v=i=>$(i).value;if(!v("#sd")||!v("#sb")||!v("#sw"))return;Object.assign(e,{date:v("#sd"),bed:v("#sb"),wake:v("#sw"),target:v("#sg")});delete e.nw;if(!S.sleep.includes(e))S.sleep.push(e);shut();sv()},
sdel:()=>{S.sleep=S.sleep.filter(x=>x!=EA);shut();sv()},
lg:d=>{S.lang=d.v;document.documentElement.lang=d.v;sv()},
ac:d=>{S.accent=d.v;accent();sv()},
gl:d=>{S.goal=Math.max(1,Math.min(20,S.goal+ +d.v));sv()},
sz:d=>{S.snooze=+d.v;sv()},
nt:async()=>{if(S.notif){S.notif=false;return sv()}try{S.notif=await Notification.requestPermission()=="granted"}catch(e){S.notif=false}if(!S.notif)toast(t("notifNo"));sv()},
bk:async()=>{const j=JSON.stringify(S,null,1);$("#bk").value=j;try{const d=await claude.use("downloads");if(d){await d.save({filename:"stucation-backup.json",data:j});return toast(t("copied"))}}catch(e){}try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download="stucation-backup.json";a.click()}catch(e){}try{await navigator.clipboard.writeText(j)}catch(e){}toast(t("copied"))},
rs:()=>{try{const j=JSON.parse($("#bk").value);if(!Array.isArray(j.subjects))throw 0;S=Object.assign(DEF(),j);fix();accent();document.documentElement.lang=S.lang;sv();toast(t("restored"))}catch(e){toast(t("bad"))}},
rz:()=>sure(()=>{S.subjects.forEach(s=>s.ch.forEach(c=>{c.s=0;delete c.d}));sv()},t("resetQ"),t("reset")),
sn:()=>{stopRing();snz.push({t:Date.now()+S.snooze*6e4,label:ringL});render()},
dis:()=>{stopRing();render()}};
document.addEventListener("click",e=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(x){}const a=e.target.closest("[data-a]");if(!a)return;const k=a.dataset.a;if(k=="x"&&e.target!=a)return;A[k]&&A[k](a.dataset,a)});
document.addEventListener("change",e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){S[f]=e.target.value.trim();save()}if(e.target.type=="file"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$("#bk").value=r.result};r.readAsText(e.target.files[0])}});
setInterval(()=>{const n=new Date(),k=ds(n)+hm(n);let l=null;
if(fired!=k){const a=S.alarms.find(a=>a.on&&a.time==hm(n)&&(!a.days.length||a.days.includes(n.getDay())));if(a){fired=k;l=a.label||t("alarm");if(!a.days.length){a.on=false;save()}}}
const i=snz.findIndex(z=>z.t<=Date.now());if(i>-1){l=snz[i].label||t("alarm");snz.splice(i,1)}
if(l!==null)ring(l);
if(n.getSeconds()==0&&!$("#m").innerHTML&&!$("#ring").className&&(tab=="home"||tab=="al"))render()},1000);
accent();document.documentElement.lang=S.lang;
$("#splash").innerHTML=`<div class="sc">${mark(88,1)}<div class="wm"><b>STU</b>cation</div><div class="mu tg">${t("tag")}</div></div>`;
render();setTimeout(()=>{$("#splash").style.opacity=0;setTimeout(()=>$("#splash").remove(),500)},1900);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
